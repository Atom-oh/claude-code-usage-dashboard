<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F4F6F9;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-product"
        class="scene"
        data-composition-id="02-product"
        data-composition-src="compositions/frames/02-product.html"
        data-start="4"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-ab"
        class="scene"
        data-composition-id="03-ab"
        data-composition-src="compositions/frames/03-ab.html"
        data-start="9"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-cost"
        class="scene"
        data-composition-id="04-cost"
        data-composition-src="compositions/frames/04-cost.html"
        data-start="14"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-agent"
        class="scene"
        data-composition-id="05-agent"
        data-composition-src="compositions/frames/05-agent.html"
        data-start="19"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-06-outro"
        class="scene"
        data-composition-id="06-outro"
        data-composition-src="compositions/frames/06-outro.html"
        data-start="24.5"
        data-duration="3.5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-product", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-03-ab", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14);
        tl.fromTo("#el-04-cost", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 14);
        tl.to("#el-05-agent", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24.5);
        tl.fromTo("#el-06-outro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24.5);
        tl.to({}, { duration: 28 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
