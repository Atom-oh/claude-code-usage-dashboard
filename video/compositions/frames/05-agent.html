  <div id="root" data-composition-id="05-agent" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <div class="clip ag-bg" id="ag-bg" data-start="0" data-duration="6" data-track-index="0"></div>
    <img class="clip ag-ghost" id="ag-ghost" src="assets/analytics.png" alt="" data-start="0" data-duration="6" data-track-index="1" />

    <div class="clip ag-status" id="ag-status" data-start="0" data-duration="6" data-track-index="4">running SQL on ClickHouse…</div>

    <div class="clip ag-table" id="ag-table" data-start="0" data-duration="6" data-track-index="5">
      <div class="ag-tr" id="ag-r1">
        <div class="ag-key">bedrock — 52 users</div>
        <div class="ag-val" style="color: #6183f0">$286.61</div>

      <div class="ag-tr" id="ag-r2">

        <div class="ag-val" style="color: #3f9c79">$221.28</div>
      </div>
      <div class="ag-tr" id="ag-r3">
        <div class="ag-key">opus family — per user</div>
        <div class="ag-val" style="color: #0f172a">$6.81</div>
      </div>
      <div class="ag-tr" id="ag-r4">
        <div class="ag-key">haiku family — per user</div>
        <div class="ag-val" style="color: #0f172a">$0.04</div>
      </div>
    </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["05-agent"] = tl;

      // Scene 1 (0.0–0.5s) — 입력 카드가 선다.
      tl.fromTo("#ag-eyebrow", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, 0);
      tl.fromTo("#ag-input", { y: 36, scale: 0.95, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 0);

      // Scene 2 (0.5–2.3s) — 질문이 사람처럼 타이핑된다(discrete-text-sequence: 시각 임계값
      // 배열을 역방향 탐색해 상태를 통째로 갈아끼우므로 seek가 양방향 안전하다).
      const typed = document.getElementById("ag-typed");
      const LINE = "compare cost: bedrock vs enterprise";
      const T0 = 0.5;
      const T_TYPE = 1.7;
      const steps = [];
      for (let i = 0; i <= LINE.length; i++) {
        steps.push({ t: T0 + (T_TYPE * i) / LINE.length, text: LINE.slice(0, i) });
      }
      const driver = { p: 0 };
      tl.to(
        driver,
        {
          p: 1,
          duration: T_TYPE + 0.01,
          ease: "none",
          onUpdate: () => {
            const now = T0 + driver.p * T_TYPE;
            let s = steps[0];
            for (let i = steps.length - 1; i >= 0; i--) {
              if (steps[i].t <= now) {
                s = steps[i];
                break;
              }
            }
            typed.textContent = s.text;
          },
        },
        T0
      );
      // 캐럿 blink — tl.time() 기반 square wave라 시크해도 같은 프레임에서 같은 상태다.
      const caret = document.getElementById("ag-caret");
      tl.to(
        { k: 0 },
        {
          k: 1,
          duration: 5.5,
          ease: "none",
          onUpdate: () => {
            caret.style.opacity = tl.time() % 0.9 < 0.45 ? "1" : "0.15";
          },
        },
        0
      );

      // Scene 3 (2.3–3.0s) — 전송: 카드가 눌리고 상태 칩이 뜬다.
      tl.fromTo("#ag-input", { scale: 1 }, { scale: 0.978, duration: 0.12, ease: "power2.in" }, 2.3);
      tl.fromTo("#ag-input", { scale: 0.978 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 2.42);
      tl.fromTo("#ag-status", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 2.5);

      // Scene 4 (3.0–5.5s) — 답변 표가 행 단위로 도착(waterfall: opacity는 set으로 0→1, 페이드 금지).
      tl.fromTo("#ag-table", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 3.0);
      const rows = ["#ag-r1", "#ag-r2", "#ag-r3", "#ag-r4"];
      rows.forEach((sel, i) => {
        const at = 3.2 + i * 0.42;
        tl.set(sel, { opacity: 1 }, at);
        tl.fromTo(sel, { y: 44 }, { y: 0, duration: 0.5, ease: "power4.out" }, at);
      });
      gsap.set(rows, { opacity: 0 });
    })();
  </script>
