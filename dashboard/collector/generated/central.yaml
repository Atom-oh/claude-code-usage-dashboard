# Generated by scripts/sync-collector-package.py; edit the canonical policy.
extensions:
  bearertokenauth:
    filename: /var/run/ccdash-ingest/token
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 2097152
        auth:
          authenticator: bearertokenauth
processors:
  resource:
    attributes:
      - key: experiment.group
        value: ${env:EXPERIMENT_GROUP:-unknown}
        action: insert

  filter/metrics:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch("${env:CLAUDE_ENABLED:-true}", "(?i)^(true|1|)$")'
        - >-
          not (
            name == "claude_code.session.count" or
            name == "claude_code.lines_of_code.count" or
            name == "claude_code.commit.count" or
            name == "claude_code.pull_request.count" or
            name == "claude_code.cost.usage" or
            name == "claude_code.token.usage" or
            name == "claude_code.code_edit_tool.decision" or
            name == "claude_code.active_time.total"
          )

  filter/logs_claude:
    error_mode: propagate
    logs:
      log_record:
        - 'not IsMatch("${env:CLAUDE_ENABLED:-true}", "(?i)^(true|1|)$")'
        - 'attributes["event.name"] != nil and IsMatch(attributes["event.name"], "^codex[.]")'
        - >-
          resource.attributes["service.name"] != "claude-code" and
          (attributes["event.name"] == nil or not IsMatch(attributes["event.name"],
          "^(claude_code[.]|api_request$|api_error$|api_refusal$|api_retries_exhausted$|tool_result$|tool_decision$|user_prompt$|compaction$|hook_execution_complete$|mcp_server_connection$|permission_mode_changed$|plugin_loaded$|skill_activated$|subagent_completed$|turn_ttft$)"))

  filter/logs_codex:
    error_mode: propagate
    logs:
      log_record:
        - 'not IsMatch("${env:CODEX_ENABLED:-true}", "(?i)^(true|1)$")'
        - 'attributes["event.name"] == nil or not IsMatch(attributes["event.name"], "^codex[.]")'

  filter/traces_claude:
    error_mode: propagate
    traces:
      span:
        - 'not IsMatch("${env:CLAUDE_ENABLED:-true}", "(?i)^(true|1|)$")'
        - 'resource.attributes["service.name"] != "claude-code"'


  transform/codex_resource:
    error_mode: propagate
    log_statements:
      - context: resource
        statements: &codex_resource
          - set(attributes["backend"], attributes["ccdash.transport.backend"]) where attributes["ccdash.transport.backend"] == "bedrock-mantle" or attributes["ccdash.transport.backend"] == "bedrock-runtime"
          - delete_key(attributes, "ccdash.transport.backend")
          - delete_key(attributes, "backend") where attributes["backend"] != "bedrock-mantle" and attributes["backend"] != "bedrock-runtime"
          - set(attributes["client"], "codex")
          - set(attributes["user.email"], "${env:CODEX_DEFAULT_USER_EMAIL:-}") where "${env:CODEX_DEFAULT_USER_EMAIL:-}" != "" and (attributes["user.email"] == nil or attributes["user.email"] == "") and (attributes["enduser.id"] == nil or attributes["enduser.id"] == "")
          - delete_key(attributes, "experiment.group")
    metric_statements:
      - context: resource
        statements: *codex_resource
    trace_statements:
      - context: resource
        statements: *codex_resource

  filter/metrics_codex:
    error_mode: propagate
    metrics:
      metric:
        - 'not IsMatch("${env:CODEX_ENABLED:-true}", "(?i)^(true|1)$")'
        - &not_codex_service 'resource.attributes["service.name"] == nil or not IsMatch(resource.attributes["service.name"], "^(codex|codex_cli_rs|codex_exec|codex-tui|codex-app-server|codex_mcp_server|codex_vscode|codex_desktop)$")'
        - 'type != METRIC_DATA_TYPE_SUM and type != METRIC_DATA_TYPE_GAUGE and type != METRIC_DATA_TYPE_HISTOGRAM and type != METRIC_DATA_TYPE_EXPONENTIAL_HISTOGRAM'
        - 'not IsMatch(name, "^codex[.][a-z][a-z0-9_.]{0,159}$")'
      datapoint:
        - 'Len(exemplars) > 0'

  filter/traces_codex:
    error_mode: propagate
    traces:
      span:
        - 'not IsMatch("${env:CODEX_ENABLED:-true}", "(?i)^(true|1)$")'
        - *not_codex_service
        - 'Len(links) > 0'
      spanevent:
        - 'true'

  transform/codex_metrics:
    error_mode: propagate
    metric_statements:
      - context: resource
        statements: &codex_safe_resource
          - >-
            keep_keys(attributes, ["client", "backend", "user.email", "user.id", "enduser.id",
            "service.name", "service.version", "service.instance.id", "session.id", "conversation.id",
            "host.name", "host.id", "process.pid", "project.name", "team", "env", "os", "os_version",
            "os.type", "os.version", "host.arch", "telemetry.sdk.name", "telemetry.sdk.language",
            "telemetry.sdk.version", "model", "provider", "provider_name", "model_provider",
            "reasoning_effort", "model_reasoning_effort", "approval_policy"])
          - set(schema_url, "")
      - context: scope
        statements: &codex_safe_scope
          - keep_keys(attributes, [])
          - set(schema_url, "")
      - context: metric
        statements:
          - set(description, "")
      - context: datapoint
        statements:
          - >-
            keep_keys(attributes, ["model", "model_provider", "provider", "provider_name",
            "reasoning_effort", "model_reasoning_effort", "effort", "tool", "tool_name",
            "tool_namespace", "call_id", "session.id", "conversation.id", "turn.id",
            "app.version", "service_name", "auth_mode", "originator", "session_source",
            "status", "status_code", "http.response.status_code", "success", "kind", "decision",
            "source", "outcome", "phase", "transport", "token_type", "sandbox",
            "approval_policy", "tty", "active", "version", "db", "catalog_surface",
            "candidate_set_truncated", "query_truncated", "query_script", "method", "command_category",
            "config_use_memories", "feature_enabled", "has_citations", "is_git", "read_allowed",
            "tmp_mem_enabled"])

  transform/codex_traces:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements: *codex_safe_resource
      - context: scope
        statements: *codex_safe_scope
      - context: span
        statements:
          - >-
            keep_keys(attributes, ["model", "model.provided", "provider", "provider_name", "model_provider",
            "tool_name", "tool_namespace", "call_id", "session.id", "conversation.id", "turn.id",
            "turn_id", "submission.id", "codex.op", "codex.turn.reasoning_effort",
            "codex.request.reasoning_effort", "codex.turn.token_usage.input_tokens",
            "codex.turn.token_usage.non_cached_input_tokens", "codex.turn.token_usage.cached_input_tokens",
            "codex.turn.token_usage.cache_write_input_tokens", "codex.turn.token_usage.output_tokens",
            "codex.turn.token_usage.reasoning_output_tokens", "codex.turn.token_usage.total_tokens",
            "codex.usage.reasoning_output_tokens", "codex.usage.total_tokens", "gen_ai.usage.input_tokens",
            "gen_ai.usage.output_tokens", "gen_ai.usage.cache_read.input_tokens",
            "gen_ai.usage.cache_write.input_tokens", "gen_ai.request.model", "gen_ai.response.model",
            "gen_ai.operation.name", "busy_ns", "idle_ns", "attempt", "aborted", "status", "status_code",
            "http.response.status_code", "http.method", "success", "decision", "source", "transport",
            "wire_api", "approval_policy", "session_init.ephemeral",
            "session_init.required_mcp_server_count", "thread_start.dynamic_tool_count", "input_count",
            "item_count", "tool_spec_count", "selected_skill_count", "catalog_entry_count", "user_input_count"])
          - set(status.message, "")
          - set(trace_state, "")
          - set(name, "codex.operation") where not IsMatch(name, "^[a-zA-Z_][a-zA-Z0-9_.:-]{0,159}$") and name != "thread/start" and name != "thread/unsubscribe"

  transform/codex_logs:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(attributes["client"], "codex")
          - delete_key(attributes, "experiment.group")
          - delete_key(resource.attributes, "experiment.group")
          - set(time, observed_time) where time_unix_nano == 0
          - 'delete_matching_keys(attributes, "(?i)^(prompt|prompt_text|user_prompt|user[.]prompt|tool_arguments|tool[.]arguments|arguments|tool_parameters|tool_output|tool[.]output|output|output_snippet|stdout|stderr|message|content)$")'
          - 'delete_matching_keys(resource.attributes, "(?i)^(prompt|prompt_text|user_prompt|user[.]prompt|tool_arguments|tool[.]arguments|arguments|tool_parameters|tool_output|tool[.]output|output|output_snippet|stdout|stderr|message|content)$")'
          - set(body, "")

  transform/scrub_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "prompt")
          - delete_key(attributes, "prompt_text")
          - set(body, "")

  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  filter/claude_trace_content:
    error_mode: propagate
    traces:
      span:
        - 'Len(links) > 0'
      spanevent:
        - 'true'
  transform/claude_trace_content:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - >-
            keep_keys(attributes, ["client", "backend", "user.email", "user.id", "enduser.id",
            "service.name", "service.version", "service.instance.id", "session.id",
            "host.name", "host.id", "project.name", "team", "experiment.group",
            "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
          - set(schema_url, "")
      - context: scope
        statements:
          - keep_keys(attributes, [])
          - set(schema_url, "")
      - context: span
        statements:
          - >-
            keep_keys(attributes, ["session.id", "span.type", "duration_ms", "ttft_ms",
            "agent_id", "parent_agent_id", "model", "decision", "app.entrypoint",
            "interaction.sequence", "interaction.duration_ms", "user_prompt_length",
            "parent.source", "gen_ai.system", "gen_ai.request.model", "query_source_safe",
            "workflow.run_id", "speed", "effort", "llm_request.context", "first_content_ms",
            "input_tokens", "output_tokens", "cache_read_tokens", "cache_creation_tokens",
            "request_id", "gen_ai.response.id", "client_request_id", "attempt", "success",
            "status_code", "error_class", "response.has_tool_call", "stop_reason",
            "gen_ai.response.finish_reasons", "tool_name_safe", "bash_command_class",
            "bash_argv0", "result_tokens", "tool_use_id", "gen_ai.tool.call.id", "source",
            "hook_event", "num_hooks", "num_success", "num_blocking",
            "num_non_blocking_error", "num_cancelled"])
          - set(status.message, "")
          - set(trace_state, "")
          - set(name, "claude_code.operation") where not IsMatch(name, "^(claude_code[.])?(interaction|llm_request|tool|tool[.]blocked_on_user|tool[.]execution|hook)$")
  transform/device_log_content:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(cache["error"], "") where attributes["error"] != nil
          - set(cache["error"], "[redacted]") where attributes["error"] != nil and attributes["error"] != ""
          - 'delete_matching_keys(attributes, "(?i)^(prompt|prompt_text|user_prompt|user[.]prompt|content|new_context|system_reminders|system_prompt_preview|user_system_prompt|tool[._]input|tool[._]output|tool[._]arguments|arguments|full_command|bash_command|stdout|stderr|message|body|body_ref|api_request_body|api_response_body|model_output|response[.]model_output|response_text|error)$")'
          - 'delete_matching_keys(resource.attributes, "(?i)^(prompt|prompt_text|user_prompt|user[.]prompt|content|new_context|system_reminders|system_prompt_preview|user_system_prompt|tool[._]input|tool[._]output|tool[._]parameters|tool[._]arguments|arguments|full_command|bash_command|stdout|stderr|message|body|body_ref|api_request_body|api_response_body|model_output|response[.]model_output|response_text|error)$")'
          - set(body, "")
          - set(attributes["error"], cache["error"]) where cache["error"] != nil
      - context: log
        error_mode: silent
        statements:
          - set(cache["tool_parameters"], attributes["tool_parameters"]) where IsString(attributes["tool_parameters"])
          - 'delete_matching_keys(attributes, "(?i)^tool[._]parameters$")'
          - set(cache["mcp"], ParseJSON("{}"))
          - set(cache["tool_parameters"], ParseJSON(cache["tool_parameters"])) where IsString(cache["tool_parameters"])
          - set(cache["mcp"]["mcp_server_name"], cache["tool_parameters"]["mcp_server_name"]) where IsMap(cache["tool_parameters"]) and IsString(cache["tool_parameters"]["mcp_server_name"])
          - set(cache["mcp"]["mcp_tool_name"], cache["tool_parameters"]["mcp_tool_name"]) where IsMap(cache["tool_parameters"]) and IsString(cache["tool_parameters"]["mcp_tool_name"])
          - set(attributes["tool_parameters"], String(cache["mcp"])) where Len(cache["mcp"]) > 0

  transform/clickhouse_event_name:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(event_name, "")
          - set(event_name, String(attributes["event.name"])) where attributes["event.name"] != nil

exporters:
  clickhouse: &clickhouse
    endpoint: tcp://${env:CH_HOST}:${env:CH_PORT}?secure=false
    database: ${env:CH_DB}
    username: ${env:CH_USER}
    password: ${file:/var/run/ccdash-clickhouse/CH_PASSWORD}
    create_schema: false
    async_insert: false
    connection_params:
      insert_allow_materialized_columns: "1"
    metrics_tables:
      sum:
        name: otel_metrics_sum
      gauge:
        name: otel_metrics_gauge
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    ttl: 0                    # TTL은 테이블 정의에서 관리
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

  clickhouse/codex:
    <<: *clickhouse
    metrics_tables:
      sum:
        name: codex_metrics_sum
      gauge:
        name: codex_metrics_gauge
      histogram:
        name: codex_metrics_histogram
      exponential_histogram:
        name: codex_metrics_exponential_histogram

service:
  extensions: [bearertokenauth, health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/metrics, resource, batch]
      exporters: [clickhouse]
    metrics/codex:
      receivers: [otlp]
      processors: [memory_limiter, filter/metrics_codex, transform/codex_resource, transform/codex_metrics, batch]
      exporters: [clickhouse/codex]
    logs/claude:
      receivers: [otlp]
      processors: [memory_limiter, filter/logs_claude, transform/scrub_logs, transform/device_log_content, transform/clickhouse_event_name, resource, batch]
      exporters: [clickhouse]
    logs/codex:
      receivers: [otlp]
      processors: [memory_limiter, filter/logs_codex, transform/codex_resource, transform/codex_logs, transform/device_log_content, transform/clickhouse_event_name, batch]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/traces_claude, filter/claude_trace_content, transform/claude_trace_content, resource, batch]
      exporters: [clickhouse]
    traces/codex:
      receivers: [otlp]
      processors: [memory_limiter, filter/traces_codex, transform/codex_resource, transform/codex_traces, batch]
      exporters: [clickhouse]
  telemetry:
    logs:
      level: info
