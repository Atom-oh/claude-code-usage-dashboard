# =============================================================================
# OTel Collector config — EC2 로컬 sidecar (Claude Code A/B)
# 배포 경로: /etc/otelcol/config.yaml
# env(/etc/otelcol/env)에서 주입되는 값: EXPERIMENT_GROUP, CH_HOST, CH_PORT,
#   CH_DB, CH_USER, CH_PASSWORD, OTELCOL_QUEUE_DIR
# =============================================================================

extensions:
  # 디스크 기반 exporter 큐. 배포 경로가 두 개고 쓰기 권한이 다르므로(fleet은 root로 돌아
  # /var/lib/otelcol, 셀프서비스는 User=%i로 /home/%i/.otelcol) 디렉터리를 하드코딩하지 않고
  # env로 받는다 — 한쪽에서는 반드시 쓰기 실패한다.
  # 옵션 이름은 contrib v0.119.0의 extension/storage/filestorage/README.md 기준
  # (directory 기본값 /var/lib/otelcol/file_storage, create_directory 기본 false).
  file_storage:
    directory: ${env:OTELCOL_QUEUE_DIR}
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317   # 로컬만 수신 (외부 노출 없음)
      # http는 쓰지 않으면 열지 않는다. 필요 시 127.0.0.1:4318 추가.

processors:
  # ---- (a) A/B 그룹 태깅 강제 --------------------------------------------
  # managed-settings의 OTEL_RESOURCE_ATTRIBUTES로도 들어오지만, Collector에서
  # 한 번 더 upsert 해두면 인스턴스 오설정 시에도 그룹이 보장된다.
  resource:
    attributes:
      - key: experiment.group
        value: ${env:EXPERIMENT_GROUP}
        action: upsert

  # ---- (b) metric 화이트리스트 -------------------------------------------
  # Claude Code 공식 8개 metric만 통과. 버전업으로 새 metric 생겨도 안 샌다.
  filter/metrics:
    error_mode: ignore
    metrics:
      metric:
        - >-
          not (
            name == "claude_code.session.count" or
            name == "claude_code.lines_of_code.count" or
            name == "claude_code.commit.count" or
            name == "claude_code.pull_request.count" or
            name == "claude_code.cost.usage" or
            name == "claude_code.token.usage" or
            name == "claude_code.code_edit_tool.decision" or
            name == "claude_code.active_time.total"
          )

  # ---- (c) 민감정보 스크럽 (logs) ----------------------------------------
  # 프롬프트 본문은 기본 미포함이지만, 방어적으로 대표 키를 삭제.
  # tool_parameters 안의 bash_command 등은 감사에 필요하면 남기고,
  # FSI 규제상 완전 차단이 필요하면 delete로.
  # 2026-08-11: STEP 3에서 요청된 신규 이벤트(skill_activated/compaction/api_refusal/
  # api_retries_exhausted/plugin_loaded 등)는 이미 여기를 그대로 통과하고 있다 — 이
  # transform 자체가 화이트리스트가 아니라 두 개의 민감 키만 지우는 스크럽이고, 로그
  # 이벤트 이름에 대한 필터는 이 config 전체에 존재하지 않는다(실측 확인, 2026-08-11).
  # 즉 collector 쪽 변경은 필요 없고, 새 이벤트를 쓰려면 clickhouse-schema.sql/
  # clickhouse-migration-002.sql의 promoted 컬럼 + grafana-ab-queries.sql 패널만 있으면 된다.
  transform/scrub_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "prompt")
          - delete_key(attributes, "prompt_text")
          # bash_command 완전 차단이 필요하면 아래 주석 해제
          # - delete_key(attributes, "tool_parameters")

  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

exporters:
  clickhouse:
    endpoint: tcp://${env:CH_HOST}:${env:CH_PORT}?secure=true
    database: ${env:CH_DB}
    username: ${env:CH_USER}
    password: ${env:CH_PASSWORD}
    # 스키마는 위 SQL로 미리 생성 → false. (true면 exporter가 자체 생성)
    # otel_traces는 clickhouse-migration-002.sql/clickhouse-schema.sql이 미리 만들어야 한다 —
    # create_schema: false라 exporter가 대신 만들어주지 않는다(2026-08-11 실측: 라이브
    # system.tables에 otel_traces가 없었음).
    create_schema: false
    metrics_tables:
      sum:
        name: otel_metrics_sum
      gauge:
        name: otel_metrics_gauge
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    ttl: 0                    # TTL은 테이블 정의에서 관리
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      # 0 = 재시도를 영원히 멈추지 않는다(collector v0.119.0 exporter/exporterhelper/README.md).
      # 300s였을 때는 ClickHouse/NLB 장애가 5분을 넘기면 그 시점의 배치가 조용히 버려졌다.
      # 이제 큐가 디스크에 있으므로 무한 재시도의 상한은 시간이 아니라 queue_size다.
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
      # storage를 지정하면 in-memory 큐가 아예 없어지고, 프로세스가 죽어도 큐에 남은 항목이
      # 재시작 후 이어서 전송된다(collector v0.119.0 exporter/exporterhelper/README.md).
      # 이것과 systemd의 Restart=always가 함께 있어야 root CLAUDE.md가 기록한 실패 모드
      # ("조용히 줄어드는 데이터 창", 실제로 ~43시간 공백이 발생) 가 닫힌다 — Restart=always는
      # 프로세스가 죽는 것을, 이 큐는 죽는 순간 실려 있던 데이터를 막는다. ClickHouse가 계속
      # 죽어 있으면 이제 5분 뒤 유실이 아니라 queue_size(1000) 배치만큼 디스크 큐가 찬다.
      storage: file_storage

service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/metrics, resource, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/scrub_logs, resource, batch]
      exporters: [clickhouse]
    # traces (beta, 2026-08-11) — CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 +
    # OTEL_TRACES_EXPORTER=otlp(user-data.sh)가 켜져야 데이터가 들어온다. resource
    # 프로세서를 metrics/logs와 공유하므로 experiment.group upsert가 traces에도 동일하게
    # 적용된다 — 별도 처리 불필요.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [clickhouse]
  telemetry:
    logs:
      level: info
