# =============================================================================
# OTel Collector config — selectable Claude Code and Codex, contrib 0.119.0.
# 배포 경로: /etc/otelcol/config.yaml
# env(/etc/otelcol/env)에서 주입되는 값: EXPERIMENT_GROUP, CH_HOST, CH_PORT,
#   CH_DB, CH_USER, CH_PASSWORD, OTELCOL_QUEUE_DIR (OTELCOL_QUEUE_DIR falls back to /var/lib/otelcol/queue, the path user-data.sh writes to /etc/otelcol/env)
# Client flags: CLAUDE_ENABLED (default true), CODEX_ENABLED (default false).
# The bootstrap service also validates CODEX_BEDROCK_ENDPOINT; backend tagging
# belongs to the Codex process and Codex-only resource processors.
# =============================================================================

extensions:
  # 디스크 기반 exporter 큐. 배포 경로가 두 개고 쓰기 권한이 다르므로(fleet은 root로 돌아
  # /var/lib/otelcol, 셀프서비스는 User=%i로 /home/%i/.otelcol) 디렉터리를 하드코딩하지 않고
  # env로 받는다 — 한쪽에서는 반드시 쓰기 실패한다.
  # 옵션 이름은 contrib v0.119.0의 extension/storage/filestorage/README.md 기준
  # (directory 기본값 /var/lib/otelcol/file_storage, create_directory 기본 false).
  file_storage:
    directory: ${env:OTELCOL_QUEUE_DIR:-/var/lib/otelcol/queue}
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317   # 로컬만 수신 (외부 노출 없음)
        include_metadata: true
      http:
        endpoint: 127.0.0.1:4318   # Codex logs, metrics and traces; loopback only.
        include_metadata: true

processors:
  # ---- (a) A/B 그룹 태깅 강제 --------------------------------------------
  # managed-settings의 OTEL_RESOURCE_ATTRIBUTES로도 들어오지만, Collector에서
  # 한 번 더 upsert 해두면 인스턴스 오설정 시에도 그룹이 보장된다.
  resource:
    attributes:
      - key: experiment.group
        value: ${env:EXPERIMENT_GROUP}
        action: upsert

  # ---- (b) metric 화이트리스트 -------------------------------------------
  # Claude Code 공식 8개 metric만 통과. 버전업으로 새 metric 생겨도 안 샌다.
  filter/metrics:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch("${env:CLAUDE_ENABLED:-true}", "(?i)^(true|1|)$")'
        - >-
          not (
            name == "claude_code.session.count" or
            name == "claude_code.lines_of_code.count" or
            name == "claude_code.commit.count" or
            name == "claude_code.pull_request.count" or
            name == "claude_code.cost.usage" or
            name == "claude_code.token.usage" or
            name == "claude_code.code_edit_tool.decision" or
            name == "claude_code.active_time.total"
          )

  # Claude's event.name is normally unprefixed (api_request, tool_result, etc.).
  # Preserve its established events and service provenance; Codex uses codex.*.
  # Model/backend and an inherited client tag never identify the producer.
  # Separate pipelines isolate resource mutations in mixed OTLP batches.
  filter/logs_claude:
    error_mode: propagate
    logs:
      log_record:
        - 'not IsMatch("${env:CLAUDE_ENABLED:-true}", "(?i)^(true|1|)$")'
        - 'attributes["event.name"] != nil and IsMatch(attributes["event.name"], "^codex[.]")'
        - >-
          resource.attributes["service.name"] != "claude-code" and
          (attributes["event.name"] == nil or not IsMatch(attributes["event.name"],
          "^(claude_code[.]|api_request$|api_error$|api_refusal$|api_retries_exhausted$|tool_result$|tool_decision$|user_prompt$|compaction$|hook_execution_complete$|mcp_server_connection$|permission_mode_changed$|plugin_loaded$|skill_activated$|subagent_completed$|turn_ttft$)"))

  filter/logs_codex:
    error_mode: propagate
    logs:
      log_record:
        - 'not IsMatch("${env:CODEX_ENABLED:-false}", "(?i)^(true|1)$")'
        - 'attributes["event.name"] == nil or not IsMatch(attributes["event.name"], "^codex[.]")'

  filter/traces_claude:
    error_mode: propagate
    traces:
      span:
        - 'not IsMatch("${env:CLAUDE_ENABLED:-true}", "(?i)^(true|1|)$")'
        - 'resource.attributes["service.name"] != "claude-code"'

  # Read only the launcher's nonsecret provenance header before batch loses
  # transport context. Never infer backend from model, span or metric attributes
  # here. Downstream dashboard queries do (dashboard/server/backend.js, ADR-017).
  resource/codex_transport:
    attributes:
      - key: ccdash.transport.backend
        action: delete
      - key: ccdash.transport.backend
        from_context: metadata.x-ccdash-backend
        action: upsert

  transform/codex_resource:
    error_mode: propagate
    log_statements:
      - context: resource
        statements: &codex_resource
          - set(attributes["backend"], attributes["ccdash.transport.backend"]) where attributes["ccdash.transport.backend"] == "bedrock-mantle" or attributes["ccdash.transport.backend"] == "bedrock-runtime"
          - delete_key(attributes, "ccdash.transport.backend")
          - delete_key(attributes, "backend") where attributes["backend"] != "bedrock-mantle" and attributes["backend"] != "bedrock-runtime"
          - set(attributes["client"], "codex")
          - delete_key(attributes, "experiment.group")
    metric_statements:
      - context: resource
        statements: *codex_resource
    trace_statements:
      - context: resource
        statements: *codex_resource

  filter/metrics_codex:
    error_mode: propagate
    metrics:
      metric:
        - 'not IsMatch("${env:CODEX_ENABLED:-false}", "(?i)^(true|1)$")'
        - &not_codex_service 'resource.attributes["service.name"] == nil or not IsMatch(resource.attributes["service.name"], "^(codex|codex_cli_rs|codex_exec|codex-tui|codex-app-server|codex_mcp_server|codex_vscode|codex_desktop)$")'
        - 'type != METRIC_DATA_TYPE_SUM and type != METRIC_DATA_TYPE_GAUGE and type != METRIC_DATA_TYPE_HISTOGRAM and type != METRIC_DATA_TYPE_EXPONENTIAL_HISTOGRAM'
        # Native metric names are identifiers; descriptions may contain content.
        - 'not IsMatch(name, "^codex[.][a-z][a-z0-9_.]{0,159}$")'
      # 0.119 cannot scrub individual exemplar maps. Native 0.154 emits none;
      # reject exemplar-bearing points rather than persist unfiltered content.
      datapoint:
        - 'Len(exemplars) > 0'

  filter/traces_codex:
    error_mode: propagate
    traces:
      span:
        - 'not IsMatch("${env:CODEX_ENABLED:-false}", "(?i)^(true|1)$")'
        - *not_codex_service
        # 0.119 has no span-link attribute context. Native 0.154 emits no links.
        - 'Len(links) > 0'
      spanevent:
        - 'true'

  transform/codex_metrics:
    error_mode: propagate
    # sandbox_policy can serialize filesystem roots; never retain it in these
    # metric/resource allowlists or the trace allowlist below. Logs own policy UI.
    metric_statements:
      - context: resource
        statements: &codex_safe_resource
          - >-
            keep_keys(attributes, ["client", "backend", "user.email", "user.id", "enduser.id",
            "service.name", "service.version", "service.instance.id", "session.id", "conversation.id",
            "host.name", "host.id", "process.pid", "project.name", "team", "env", "os", "os_version",
            "os.type", "os.version", "host.arch", "telemetry.sdk.name", "telemetry.sdk.language",
            "telemetry.sdk.version", "model", "provider", "provider_name", "model_provider",
            "reasoning_effort", "model_reasoning_effort", "approval_policy"])
          - set(schema_url, "")
      - context: scope
        statements: &codex_safe_scope
          - keep_keys(attributes, [])
          - set(schema_url, "")
      - context: metric
        statements:
          - set(description, "")
      - context: datapoint
        statements:
          - >-
            keep_keys(attributes, ["model", "model_provider", "provider", "provider_name",
            "reasoning_effort", "model_reasoning_effort", "effort", "tool", "tool_name",
            "tool_namespace", "call_id", "session.id", "conversation.id", "turn.id",
            "app.version", "service_name", "auth_mode", "originator", "session_source",
            "status", "status_code", "http.response.status_code", "success", "kind", "decision",
            "source", "outcome", "phase", "transport", "token_type", "sandbox",
            "approval_policy", "tty", "active", "version", "db", "catalog_surface",
            "candidate_set_truncated", "query_truncated", "query_script", "method", "command_category",
            "config_use_memories", "feature_enabled", "has_citations", "is_git", "read_allowed",
            "tmp_mem_enabled"])

  transform/codex_traces:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements: *codex_safe_resource
      - context: scope
        statements: *codex_safe_scope
      - context: span
        statements:
          - >-
            keep_keys(attributes, ["model", "model.provided", "provider", "provider_name", "model_provider",
            "tool_name", "tool_namespace", "call_id", "session.id", "conversation.id", "turn.id",
            "turn_id", "submission.id", "codex.op", "codex.turn.reasoning_effort",
            "codex.request.reasoning_effort", "codex.turn.token_usage.input_tokens",
            "codex.turn.token_usage.non_cached_input_tokens", "codex.turn.token_usage.cached_input_tokens",
            "codex.turn.token_usage.cache_write_input_tokens", "codex.turn.token_usage.output_tokens",
            "codex.turn.token_usage.reasoning_output_tokens", "codex.turn.token_usage.total_tokens",
            "codex.usage.reasoning_output_tokens", "codex.usage.total_tokens", "gen_ai.usage.input_tokens",
            "gen_ai.usage.output_tokens", "gen_ai.usage.cache_read.input_tokens",
            "gen_ai.usage.cache_write.input_tokens", "gen_ai.request.model", "gen_ai.response.model",
            "gen_ai.operation.name", "busy_ns", "idle_ns", "attempt", "aborted", "status", "status_code",
            "http.response.status_code", "http.method", "success", "decision", "source", "transport",
            "wire_api", "approval_policy", "session_init.ephemeral",
            "session_init.required_mcp_server_count", "thread_start.dynamic_tool_count", "input_count",
            "item_count", "tool_spec_count", "selected_skill_count", "catalog_entry_count", "user_input_count"])
          - set(status.message, "")
          - set(trace_state, "")
          # Keep operation names, never a dynamic URL/path or free-text title.
          - set(name, "codex.operation") where not IsMatch(name, "^[a-zA-Z_][a-zA-Z0-9_.:-]{0,159}$") and name != "thread/start" and name != "thread/unsubscribe"

  transform/codex_logs:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(attributes["client"], "codex")
          - delete_key(attributes, "experiment.group")
          - delete_key(resource.attributes, "experiment.group")
          # Codex 0.154.0 emits zero native time and a valid observed timestamp.
          # Preserve nonzero source time and event.timestamp for retry identity.
          - set(time, observed_time) where time_unix_nano == 0
          - 'delete_matching_keys(attributes, "(?i)^(prompt|prompt_text|user_prompt|user[.]prompt|tool_arguments|tool[.]arguments|arguments|tool_parameters|tool_output|tool[.]output|output|output_snippet|stdout|stderr|message|content)$")'
          - 'delete_matching_keys(resource.attributes, "(?i)^(prompt|prompt_text|user_prompt|user[.]prompt|tool_arguments|tool[.]arguments|arguments|tool_parameters|tool_output|tool[.]output|output|output_snippet|stdout|stderr|message|content)$")'
          # Structured attributes carry all supported measurements. The body may
          # contain arbitrary content; clearing it leaves metadata/tokens intact.
          - set(body, "")

  # ---- (c) Existing Claude log privacy filter -----------------------------
  # 프롬프트 본문은 기본 미포함이지만, 방어적으로 대표 키를 삭제.
  # tool_parameters 안의 bash_command 등은 감사에 필요하면 남기고,
  # FSI 규제상 완전 차단이 필요하면 delete로.
  # Both unprefixed and namespaced Claude events retain the existing scrub.
  transform/scrub_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "prompt")
          - delete_key(attributes, "prompt_text")
          # bash_command 완전 차단이 필요하면 아래 주석 해제
          # - delete_key(attributes, "tool_parameters")

  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

exporters:
  clickhouse: &clickhouse
    endpoint: tcp://${env:CH_HOST}:${env:CH_PORT}?secure=true
    database: ${env:CH_DB}
    username: ${env:CH_USER}
    password: ${env:CH_PASSWORD}
    # 스키마는 위 SQL로 미리 생성 → false. (true면 exporter가 자체 생성)
    # otel_traces는 clickhouse-migration-002.sql/clickhouse-schema.sql이 미리 만들어야 한다 —
    # create_schema: false라 exporter가 대신 만들어주지 않는다(2026-08-11 실측: 라이브
    # system.tables에 otel_traces가 없었음).
    create_schema: false
    metrics_tables:
      sum:
        name: otel_metrics_sum
      gauge:
        name: otel_metrics_gauge
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    ttl: 0                    # TTL은 테이블 정의에서 관리
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      # 0 = 재시도를 영원히 멈추지 않는다(collector v0.119.0 exporter/exporterhelper/README.md).
      # 300s였을 때는 ClickHouse/NLB 장애가 5분을 넘기면 그 시점의 배치가 조용히 버려졌다.
      # 이제 큐가 디스크에 있으므로 무한 재시도의 상한은 시간이 아니라 queue_size다.
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
      # storage를 지정하면 in-memory 큐가 아예 없어지고, 프로세스가 죽어도 큐에 남은 항목이
      # 재시작 후 이어서 전송된다(collector v0.119.0 exporter/exporterhelper/README.md).
      # 이것과 systemd의 Restart=always가 함께 있어야 root CLAUDE.md가 기록한 실패 모드
      # ("조용히 줄어드는 데이터 창", 실제로 ~43시간 공백이 발생) 가 닫힌다 — Restart=always는
      # 프로세스가 죽는 것을, 이 큐는 죽는 순간 실려 있던 데이터를 막는다. ClickHouse가 계속
      # 죽어 있으면 이제 5분 뒤 유실이 아니라 queue_size(1000) 배치만큼 디스크 큐가 찬다.
      storage: file_storage

  # Dedicated metric storage, with the exact contrib 0.119.0 insert contract.
  clickhouse/codex:
    <<: *clickhouse
    metrics_tables:
      sum:
        name: codex_metrics_sum
      gauge:
        name: codex_metrics_gauge
      histogram:
        name: codex_metrics_histogram
      exponential_histogram:
        name: codex_metrics_exponential_histogram

service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/metrics, resource, batch]
      exporters: [clickhouse]
    metrics/codex:
      receivers: [otlp]
      processors: [memory_limiter, filter/metrics_codex, resource/codex_transport, transform/codex_resource, transform/codex_metrics, batch]
      exporters: [clickhouse/codex]
    logs/claude:
      receivers: [otlp]
      processors: [memory_limiter, filter/logs_claude, transform/scrub_logs, resource, batch]
      exporters: [clickhouse]
    logs/codex:
      receivers: [otlp]
      processors: [memory_limiter, filter/logs_codex, resource/codex_transport, transform/codex_resource, transform/codex_logs, batch]
      exporters: [clickhouse]
    # traces (beta, 2026-08-11) — CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 +
    # OTEL_TRACES_EXPORTER=otlp(user-data.sh)가 켜져야 데이터가 들어온다. resource
    # 프로세서를 metrics/logs와 공유하므로 experiment.group upsert가 traces에도 동일하게
    # 적용된다 — 별도 처리 불필요.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/traces_claude, resource, batch]
      exporters: [clickhouse]
    traces/codex:
      receivers: [otlp]
      processors: [memory_limiter, filter/traces_codex, resource/codex_transport, transform/codex_resource, transform/codex_traces, batch]
      exporters: [clickhouse]
  telemetry:
    logs:
      level: info
