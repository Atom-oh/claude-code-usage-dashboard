name: AI Code Review

# Trusted base checkout; PR content is data, never executable workflow code.
# Independent Codex and Claude specialists review the complete change; trusted
# routing requires Kiro for applicable AWS and operations changes. Missing coverage
# blocks the verdict. See docs/pr-review-specialists.md.

on:
  pull_request_target:
    types: [opened, synchronize]

env:
  ROLE_REVIEW: "1"
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  GH_REPO: ${{ github.repository }}

jobs:
  review:
    name: AI Code Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: claude-code-usage-dashboard-claude-arm
    # Defaults allow AWS summary fallback, both Kiro preflights/barrier, panel
    # retries and chair fallback (about 54 minutes), plus collection/publication.
    timeout-minutes: 60
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      contents: read
    env:
      # The chair model comes from synthesize.sh. Signing region must match the
      # endpoint even with a global inference profile.
      CLAUDE_CODE_USE_BEDROCK: 1
      ANTHROPIC_BEDROCK_BASE_URL: https://bedrock-runtime.ap-northeast-2.amazonaws.com
      AWS_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Prepare fresh review workspace
        run: |
          test ! -L /tmp/pr-review
          rm -rf -- /tmp/pr-review
          mkdir -p /tmp/pr-review

      - name: Verify CLIs present (runner image)
        run: |
          command -v claude >/dev/null 2>&1 || { echo "::warning::claude not found"; npm install -g @anthropic-ai/claude-code; }
          claude --version
          command -v python3 >/dev/null 2>&1 || { echo "::error::python3 is required for review context"; exit 1; }
          command -v codex >/dev/null 2>&1 || { echo "::error::codex not found on runner (image needs rebuild)"; exit 1; }
          codex --version
          if [ "$ROLE_REVIEW" = 1 ]; then
            if command -v kiro-cli >/dev/null 2>&1; then
              kiro-cli --version
            else
              echo "::warning::kiro-cli not found on runner (image needs rebuild)"
            fi
          fi

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid head SHA"; exit 1; }
          MERGE_BASE_SHA=$(gh api "repos/${GH_REPO}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')
          [[ "$MERGE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid merge base"; exit 1; }
          # Fetch objects as data; PR-head code is never checked out or run.
          git fetch --no-tags --depth=1 origin "$MERGE_BASE_SHA" "$HEAD_SHA"
          # Diff pinned commits as data, including lockfiles. Disable renames so
          # specialist collection retains both sides of every changed path.
          git -c diff.noprefix=false diff --no-color --no-ext-diff --no-textconv --no-renames \
            "$MERGE_BASE_SHA" "$HEAD_SHA" -- > /tmp/pr-diff.txt
          git diff --name-only -z --no-renames "$MERGE_BASE_SHA" "$HEAD_SHA" -- . > /tmp/pr-changed-paths.txt
          echo "total_bytes=$(wc -c < /tmp/pr-diff.txt)" >> "$GITHUB_ENV"
          echo "total_lines=$(wc -l < /tmp/pr-diff.txt)" >> "$GITHUB_ENV"

      - name: Build lens prompts (L2-L5, one self-contained lens each)
        run: |
          set -euo pipefail
          # Fail closed: an oversized diff is blocked, never reviewed as a prefix.
          read -r MAX_LINES MAX_BYTES < <(python3 scripts/pr-review/input_limits.py)
          if [ "${total_lines:-0}" -gt "$MAX_LINES" ] || [ "${total_bytes:-0}" -gt "$MAX_BYTES" ]; then
            {
              echo "## Review blocked"
              echo ""
              echo "The diff is ${total_lines} lines / ${total_bytes} bytes, over the ${MAX_LINES}-line / ${MAX_BYTES}-byte review limit. Split the PR; a partial review is never published as a pass."
              echo ""
              echo "VERDICT: FAIL"
            } > /tmp/review.md
            echo "diff_oversize=1" >> "$GITHUB_ENV"
            echo "chair_failed=1" >> "$GITHUB_ENV"
            exit 0
          fi
          rm -rf /tmp/pr-review/lenses
          mkdir -p /tmp/pr-review/lenses
          python3 scripts/pr-review/build-prompts.py panel \
            /tmp/pr-diff.txt /tmp/pr-review/lenses --revision "$BASE_SHA" \
            --changed-paths /tmp/pr-changed-paths.txt

      - name: Run Codex lens panel and Claude chair
        if: ${{ env.diff_oversize != '1' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PANEL_TIMEOUT: "300"
          CHANGED_PATHS: /tmp/pr-changed-paths.txt
          # Specialist input collection resolves the pinned merge base through the API.
          GH_TOKEN: ${{ env.ROLE_REVIEW == '1' && github.token || '' }}
        run: |
          set -euo pipefail
          DIFF_SHA="$(sha256sum /tmp/pr-diff.txt | cut -d' ' -f1)"
          bash scripts/pr-review/run-panel.sh /tmp/pr-diff.txt /tmp/pr-review/lenses /tmp/pr-review
          # The chair must adjudicate the exact diff the panel reviewed.
          [ "$(sha256sum /tmp/pr-diff.txt | cut -d' ' -f1)" = "$DIFF_SHA" ] || { echo "::error::diff changed after panel review"; exit 1; }
          bash scripts/pr-review/synthesize.sh /tmp/pr-diff.txt /tmp/pr-review \
            "$PR_NUMBER" "$PR_TITLE" /tmp/review.md
          echo "panel_responded=$(paste -sd ' ' /tmp/pr-review/responded.txt 2>/dev/null)" >> "$GITHUB_ENV"

      - name: Preserve specialist scope and execution evidence
        if: ${{ !cancelled() && env.ROLE_REVIEW == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: specialist-review-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/pr-review/slot/*-result.json
            /tmp/pr-review/slot/*-request.json
            /tmp/pr-review/slot/*-timing.json
            /tmp/pr-review/slot/*-preflight.json
            /tmp/pr-review/slot/*.flag
            /tmp/pr-review/role-plan.json
            /tmp/pr-review/role-summary.json
            /tmp/pr-review/role-source.json
          if-no-files-found: error

      - name: Check for blocking issues
        id: gate
        run: |
          . scripts/pr-review/lib.sh
          if RESULT="$(review_verdict /tmp/review.md)"; then
            echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review comment (upsert)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GATE_RESULT: ${{ steps.gate.outputs.result }}
        run: |
          CURRENT_HEAD="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            echo "::error::PR head changed; this review belongs to an older commit"
            exit 1
          fi
          MARKER="<!-- multi-ai-pr-review -->"
          if [ "$GATE_RESULT" = "fail" ] && [ "${chair_failed:-0}" = "1" ]; then
            STATUS_BADGE="**Status: BLOCKED** — required review execution or coverage failed"
          elif [ "$GATE_RESULT" = "fail" ]; then
            STATUS_BADGE="**Status: BLOCKED** — CRITICAL/MAJOR issues must be resolved before merge"
          else
            STATUS_BADGE="**Status: PASSED** — No blocking issues found"
          fi
          sed '$ { /^VERDICT:/d }' /tmp/review.md > /tmp/review-clean.md
          {
            echo "$MARKER"
            echo "## AI Code Review — Specialists"
            echo "_Specialists responded: ${panel_responded:-none} · Summary: ${chair_used:-pending}_"
            echo ""
            echo "$STATUS_BADGE"
            echo ""
            cat /tmp/review-clean.md
            echo ""
            echo "---"
            echo "_Triggered by commit \`${{ github.event.pull_request.head.sha }}\` · workflow: \`.github/workflows/pr-review.yml\`_"
          } > /tmp/comment.md
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- multi-ai-pr-review -->")) | .id' 2>/dev/null | head -1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING" -X PATCH -f body="$(cat /tmp/comment.md)" 2>/dev/null || \
              gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          fi

      - name: Fail if CRITICAL or MAJOR
        if: steps.gate.outputs.result == 'fail'
        run: |
          echo "AI Review failed"
          exit 1
