name: Deploy docs site to GitHub Pages

# Static HTML plus SHA256-verified media from the pinned documentation snapshot.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/fetch-docs-media.py"
      - "video/docs-demo/media.lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포는 하나만 — 진행 중인 배포는 취소하지 않는다(반쯤 올라간 사이트가 남지 않게).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify documentation media
        run: python3 scripts/fetch-docs-media.py --site-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
