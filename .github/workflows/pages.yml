name: Deploy docs site to GitHub Pages

# site/ 는 빌드 단계가 없는 정적 HTML이다 — 그대로 업로드해 Pages로 서빙한다.
# (Jekyll/번들러를 붙이지 않은 이유: 페이지 4장에 빌드 파이프라인은 과하다.)
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포는 하나만 — 진행 중인 배포는 취소하지 않는다(반쯤 올라간 사이트가 남지 않게).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
