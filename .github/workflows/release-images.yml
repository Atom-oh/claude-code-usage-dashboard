name: Release images

# Attaches the linux/arm64 dashboard image to a published vX.Y.Z GitHub release as a
# `docker load` archive, with SHA256SUMS and a build provenance attestation. The image is
# built from the tag by scripts/build-release.py with every inspection the deployment
# runbook relies on. The receiver stays the upstream Collector image until the packaged
# install's own build replaces it. Runs on a GitHub-hosted ARM runner: the job holds a
# release-write token, so it never shares the self-hosted runners.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z release tag
        required: true
      upload:
        description: Attach to the release (off keeps a workflow artifact only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      UPLOAD: ${{ github.event_name == 'release' || inputs.upload }}
    steps:
      - name: Validate the release tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::not a vX.Y.Z release tag: $TAG"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated tag on main
        run: |
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] || { echo "::error::$TAG is not annotated"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" FETCH_HEAD \
            || { echo "::error::$TAG is not on main"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")" ]
      - uses: docker/setup-buildx-action@v3
      - name: Build and inspect the ARM64 image from the tag
        run: |
          python3 scripts/build-release.py --image "ccdash-dashboard:$TAG" \
            --record "$RUNNER_TEMP/ccdash-release.json"
      - name: Package the image archive, manifest and checksums
        run: |
          mkdir dist
          archive="ccdash-dashboard-$TAG-linux-arm64.tar.gz"
          docker save "ccdash-dashboard:$TAG" | gzip -n -9 > "dist/$archive"
          # Public identity only; the full build record stays private (runtime-distribution.md).
          python3 - "$RUNNER_TEMP/ccdash-release.json" "dist/ccdash-dashboard-$TAG-linux-arm64.json" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1]))
          manifest = {key: record[key] for key in ("revision", "image", "platform", "localImageId", "digest")}
          manifest["imageId"] = manifest.pop("localImageId")
          manifest["buildDigest"] = manifest.pop("digest")
          with open(sys.argv[2], "w") as out:
              json.dump(manifest, out, indent=2)
              out.write("\n")
          PY
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ccdash-dashboard-*-linux-arm64.tar.gz
            dist/ccdash-dashboard-*-linux-arm64.json
      - name: Attach to the release (existing assets are never replaced)
        if: env.UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
      - name: Keep a workflow artifact instead
        if: env.UPLOAD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ccdash-dashboard-${{ env.TAG }}-linux-arm64
          path: dist/
          retention-days: 7
