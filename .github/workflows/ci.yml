name: CI

# Tests, builds, harness and HCL checks run on GitHub-hosted runners; the runtime image build
# runs on the credential-free self-hosted ARM runner (claude-code-usage-dashboard-arm). Never use
# the AI review runner (claude-code-usage-dashboard-claude-arm) here: it holds Bedrock/AWS and
# reviewer credentials, and this workflow executes pull-request code.
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

# 같은 ref의 이전 실행은 취소한다 — CI는 배포가 아니라 검증이라 중간 결과가 남아도 무해하다
# (pages.yml이 cancel-in-progress: false인 것과 반대 이유).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    # Registry installation can take seven minutes before the SQL suite starts.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/server/package-lock.json
            dashboard/web/package-lock.json
      - run: npm ci
        working-directory: dashboard/server
      - run: npm test
        working-directory: dashboard/server
      - name: Verify client aggregation against ClickHouse
        run: bash scripts/test-client-sql.sh
      - name: Verify generated Codex cost schema and raw/fact parity
        run: |
          node scripts/generate-codex-cost-schema.mjs --check
          python3 scripts/test-codex-cost-schema.py
      - name: Verify generated Claude provider schema
        run: node scripts/generate-claude-provider-schema.mjs --check
      - name: Verify generated session turns schema
        run: node scripts/generate-session-turns-schema.mjs --check
      - name: Verify generated Codex turns schema
        run: node scripts/generate-codex-turns-schema.mjs --check
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/server/package-lock.json
      - run: npm ci
        working-directory: dashboard/server
      - name: Verify generated Codex diagnostic schema and raw/state parity
        run: |
          node scripts/generate-codex-diagnostic-schema.mjs --check
          python3 scripts/test-codex-diagnostic-schema.py
      - name: Verify Codex turn rollup against raw turn spans
        run: python3 scripts/test-codex-turns-schema.py

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify declared schema compatibility contract against ClickHouse
        run: python3 scripts/build-schema-contract.py --check
      - name: Verify empty bootstrap and read-only existing-schema lifecycle
        run: python3 scripts/test-schema-lifecycle.py

  device-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deterministic packages and configuration preservation
        run: python3 -m unittest discover -s dashboard/collector/tests -p 'test_*.py'
      - name: Verify the receiver build definition
        run: python3 -m unittest discover -s collector-build/tests -p 'test_*.py'
      - name: Verify pinned Collector policies and existing ClickHouse schema
        run: python3 scripts/test-device-collector-sql.py

  web:
    runs-on: ubuntu-latest
    # Both locked installs and the browser download precede the auth regression.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/server/package-lock.json
            dashboard/web/package-lock.json
      - run: npm ci
        working-directory: dashboard/web
      - run: npm run build
        working-directory: dashboard/web
      - run: npm test
        working-directory: dashboard/web
      - name: Install server packages for the auth browser fixture
        run: npm ci
        working-directory: dashboard/server
      - name: Install Chromium for authentication regression
        run: npx playwright install --with-deps chromium
        working-directory: dashboard/web
      - name: Verify native logout in the production SPA
        run: node scripts/test-auth-browser.mjs

  runtime:
    # Pushes and same-repository PRs use the self-hosted ARM runner: ephemeral ARC pods with dind
    # under a no-permission service account (no Pod Identity, no secrets), IMDSv2 hop limit 1,
    # and a required pod anti-affinity so they never share a node with another runner - in
    # particular the *-claude-arm review runners that hold Bedrock/AWS credentials
    # (AWS-Demo-Platform runner appset). Fork PRs - this repository is public - stay on the
    # GitHub-hosted ARM runner. Both pull the digest-pinned official Node image from its
    # default public.ecr.aws path (no registry credentials); the layer cache keyed on the
    # Dockerfile reuses unchanged dependency layers. PRs build whenever an archived build input
    # changes (all of dashboard/, LICENSE, the release script, this workflow or the runtime
    # page); pushes always build.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'claude-code-usage-dashboard-arm' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether this change can affect the runtime image
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BASE_SHA...HEAD")"
          if printf '%s\n' "$changed" | grep -qE '^(dashboard/|LICENSE$|scripts/build-release\.py$|\.github/workflows/ci\.yml$|docs/reference/runtime-distribution\.md$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No archived build input changed; the build runs on the next main push."
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.build == 'true'
      - uses: actions/cache@v4
        if: steps.scope.outputs.build == 'true'
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: runtime-buildx-${{ hashFiles('dashboard/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            runtime-buildx-${{ hashFiles('dashboard/Dockerfile') }}-
      - name: Build and inspect the committed ARM64 distribution without publishing
        if: steps.scope.outputs.build == 'true'
        run: |
          python3 scripts/build-release.py --image "ccdash-ci:${GITHUB_SHA}" \
            --record "$RUNNER_TEMP/ccdash-release.json" \
            --cache-from "type=local,src=$RUNNER_TEMP/buildx-cache" \
            --cache-to "type=local,dest=$RUNNER_TEMP/buildx-cache-new,mode=max"
          # Replace rather than grow the cache directory (buildx never prunes a local cache).
          rm -rf "$RUNNER_TEMP/buildx-cache" && mv "$RUNNER_TEMP/buildx-cache-new" "$RUNNER_TEMP/buildx-cache"

  receiver:
    # Builds the OCB receiver image (collector-build/) and checks it against central.yaml and the
    # existing ClickHouse schema. Nothing is published; production still runs the upstream contrib
    # image. It holds no secrets and runs GitHub-hosted for every event (ARM, for the arm64-only
    # image), as device-collector does, because the SQL check pulls ClickHouse anonymously from
    # Docker Hub, which the self-hosted runners' shared NAT would expose to rate limits. Bind mounts come from
    # $RUNNER_TEMP on the runner's local daemon; --mount fails instead of creating an empty path
    # when a source is missing.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether this change can affect the receiver image
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BASE_SHA...HEAD")"
          if printf '%s\n' "$changed" | grep -qE '^(collector-build/|dashboard/collector/generated/central\.yaml$|dashboard/collector/release\.json$|scripts/test-device-collector-sql\.py$|\.github/workflows/ci\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No receiver build input changed; the build runs on the next main push."
          fi
      - name: Verify the build definition against the upstream manifest
        if: steps.scope.outputs.build == 'true'
        run: |
          version="$(python3 -c 'import json; print(json.load(open("dashboard/collector/release.json"))["version"])')"
          curl -fsSL -o "$RUNNER_TEMP/upstream-manifest.yaml" \
            "https://raw.githubusercontent.com/open-telemetry/opentelemetry-collector-releases/v${version}/distributions/otelcol-contrib/manifest.yaml"
          CCDASH_UPSTREAM_RECEIVER_MANIFEST="$RUNNER_TEMP/upstream-manifest.yaml" \
            python3 -m unittest discover -s collector-build/tests -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.build == 'true'
      - name: Build the ARM64 receiver image without publishing
        if: steps.scope.outputs.build == 'true'
        run: docker buildx build --platform linux/arm64 --load -t ccdash-receiver:ci collector-build
      - name: Validate central.yaml in the image with production's security context
        if: steps.scope.outputs.build == 'true'
        run: |
          # central.yaml already names the production mount paths, so it is mounted unchanged.
          work="$RUNNER_TEMP/receiver-validate"
          mkdir -p "$work"
          cp dashboard/collector/generated/central.yaml "$work/config.yaml"
          printf 'fixture-internal-token' > "$work/token"
          printf 'fixture-only' > "$work/CH_PASSWORD"
          chmod 0444 "$work/config.yaml" "$work/token" "$work/CH_PASSWORD"
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env CH_HOST=127.0.0.1 --env CH_PORT=9000 --env CH_DB=claude_code --env CH_USER=fixture \
            --mount "type=bind,src=$work/config.yaml,dst=/etc/otelcol/config.yaml,readonly" \
            --mount "type=bind,src=$work/token,dst=/var/run/ccdash-ingest/token,readonly" \
            --mount "type=bind,src=$work/CH_PASSWORD,dst=/var/run/ccdash-clickhouse/CH_PASSWORD,readonly" \
            ccdash-receiver:ci validate --config=/etc/otelcol/config.yaml
      - name: Verify the extracted binary against the existing ClickHouse schema
        if: steps.scope.outputs.build == 'true'
        run: |
          cid="$(docker create ccdash-receiver:ci)"
          docker cp "$cid:/otelcol-ccdash-receiver" "$RUNNER_TEMP/otelcol-ccdash-receiver"
          docker rm "$cid"
          CCDASH_RECEIVER_BINARY="$RUNNER_TEMP/otelcol-ccdash-receiver" \
            python3 -m unittest discover -s collector-build/tests -p 'test_*.py' -v
          CCDASH_TEST_RECEIVER_BINARY="$RUNNER_TEMP/otelcol-ccdash-receiver" \
            python3 scripts/test-device-collector-sql.py

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # .claude/ 는 gitignore 대상이라 이 체크아웃에는 없다 — tests/ 쪽 가드가 그 그룹을
      # skip으로 처리한다(tests/hooks/test-hooks.sh, tests/structure/test-plugin-structure.sh).
      - run: bash tests/run-all.sh

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          # infra/providers.tf가 선언한 하한(>= 1.9)에서 검증한다 — 최신 버전만 통과하는
          # HCL이 들어오면 선언이 거짓이 된다.
          terraform_version: 1.9.x
      - run: terraform fmt -check -recursive infra/
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
      - name: Verify dedicated-installation identity inputs without AWS access
        run: bash scripts/test-identity-terraform.sh
      - name: Verify customer infrastructure lookups with mocked providers
        run: bash scripts/test-installation-terraform.sh
      - name: Verify Bedrock profile IAM resources with mocked AWS data
        run: bash scripts/test-bedrock-routing-terraform.sh
      - name: Verify immutable schema inputs and initializer behavior with mocked providers
        run: bash scripts/test-schema-lifecycle-terraform.sh
      - name: Verify dashboard secret migration with mocked providers
        run: bash scripts/test-dashboard-secrets-terraform.sh
      - name: Verify opt-in device ingestion resources with mocked providers
        run: bash scripts/test-device-ingest-terraform.sh
