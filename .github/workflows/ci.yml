name: CI

# 테스트/빌드/하니스/HCL 검증을 GitHub-hosted 러너에서 돌린다. pr-review.yml의 self-hosted
# 러너(claude-code-usage-dashboard-claude-arm)는 AI 리뷰 패널 전용이라 여기서 쓰지 않는다 —
# 러너 한 대에 CI까지 얹으면 리뷰가 CI 큐를 기다린다.
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

# 같은 ref의 이전 실행은 취소한다 — CI는 배포가 아니라 검증이라 중간 결과가 남아도 무해하다
# (pages.yml이 cancel-in-progress: false인 것과 반대 이유).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    # Registry installation can take seven minutes before the SQL suite starts.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/server/package-lock.json
            dashboard/web/package-lock.json
      - run: npm ci
        working-directory: dashboard/server
      - run: npm test
        working-directory: dashboard/server
      - name: Verify client aggregation against ClickHouse
        run: bash scripts/test-client-sql.sh
      - name: Verify generated Codex cost schema and raw/fact parity
        run: |
          node scripts/generate-codex-cost-schema.mjs --check
          python3 scripts/test-codex-cost-schema.py

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify declared schema compatibility contract against ClickHouse
        run: python3 scripts/build-schema-contract.py --check
      - name: Verify empty bootstrap and read-only existing-schema lifecycle
        run: python3 scripts/test-schema-lifecycle.py

  device-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deterministic packages and configuration preservation
        run: python3 -m unittest discover -s dashboard/collector/tests -p 'test_*.py'
      - name: Verify pinned Collector policies and existing ClickHouse schema
        run: python3 scripts/test-device-collector-sql.py

  web:
    runs-on: ubuntu-latest
    # Both locked installs and the browser download precede the auth regression.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/server/package-lock.json
            dashboard/web/package-lock.json
      - run: npm ci
        working-directory: dashboard/web
      - run: npm run build
        working-directory: dashboard/web
      - run: npm test
        working-directory: dashboard/web
      - name: Install server packages for the auth browser fixture
        run: npm ci
        working-directory: dashboard/server
      - name: Install Chromium for authentication regression
        run: npx playwright install --with-deps chromium
        working-directory: dashboard/web
      - name: Verify native logout in the production SPA
        run: node scripts/test-auth-browser.mjs

  runtime:
    # Source compilation uses native ARM64 and two make jobs. Keep every existing
    # inspection; its larger time budget covers compilation, not test retries.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and inspect the committed ARM64 distribution without publishing
        run: |
          python3 scripts/build-release.py --image "ccdash-ci:${GITHUB_SHA}" \
            --record "$RUNNER_TEMP/ccdash-release.json"

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # .claude/ 는 gitignore 대상이라 이 체크아웃에는 없다 — tests/ 쪽 가드가 그 그룹을
      # skip으로 처리한다(tests/hooks/test-hooks.sh, tests/structure/test-plugin-structure.sh).
      - run: bash tests/run-all.sh

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          # infra/providers.tf가 선언한 하한(>= 1.9)에서 검증한다 — 최신 버전만 통과하는
          # HCL이 들어오면 선언이 거짓이 된다.
          terraform_version: 1.9.x
      - run: terraform fmt -check -recursive infra/
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
      - name: Verify dedicated-installation identity inputs without AWS access
        run: bash scripts/test-identity-terraform.sh
      - name: Verify customer infrastructure lookups with mocked providers
        run: bash scripts/test-installation-terraform.sh
      - name: Verify Bedrock profile IAM resources with mocked AWS data
        run: bash scripts/test-bedrock-routing-terraform.sh
      - name: Verify immutable schema inputs and initializer behavior with mocked providers
        run: bash scripts/test-schema-lifecycle-terraform.sh
      - name: Verify opt-in device ingestion resources with mocked providers
        run: bash scripts/test-device-ingest-terraform.sh
